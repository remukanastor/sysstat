<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#000"><title>GOV // SYSTEM TERMINAL // CLASSIFIED</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" class="boot"><div class="boot-inner"><div class="boot-title">GOV SYSTEM</div><div id="bootStatus" class="boot-status">INITIALIZING...</div><div class="boot-bar"><span id="bootProgress"></span></div></div></div>
<main class="screen"><div class="crt-lines"></div><div class="noise"></div><div class="vignette"></div>
<header class="topbar"><span>GOV // SECURE TERMINAL</span><button id="soundBtn" type="button">SOUND: OFF</button></header>
<section class="terminal-wrap"><div id="terminal" class="terminal" aria-live="polite"></div><form id="commandForm" class="prompt-row" autocomplete="off"><label class="prompt-label" for="commandInput">user@gov:~$</label><input id="commandInput" class="command-input" name="command" type="text" inputmode="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Terminal command" disabled><span id="cursor" class="cursor" aria-hidden="true"></span></form></section>
<div id="toast" class="toast" role="status" aria-live="polite"></div></main>
<script src="script.js"></script></body></html>
