<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="System status terminal">
  <title>GOV // SYSTEM STATUS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crt">
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="flicker"></div>

    <main class="terminal">
      <div id="terminalOutput"></div>
      <div id="activePrompt" class="active-prompt"></div>
    </main>

    <div id="bootOverlay" class="boot-overlay">
      <div class="boot-label">INITIALIZING TERMINAL</div>
      <div class="progress"><span></span></div>
      <div class="boot-sub">SECURE CONSOLE // GOV NODE</div>
    </div>

    <button id="soundButton" class="sound-button" aria-label="Toggle terminal sound">SOUND: OFF</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
